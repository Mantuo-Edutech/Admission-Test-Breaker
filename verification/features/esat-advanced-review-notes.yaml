boundaries:
  - 邀请码只授予 ESAT 深度笔记权限，不授予冰冰、老师、家长或 Agent 读取学生课程信息与练习记录的权限。
  - 页面不会向未授权浏览器发送正文；官方原始 PDF 不进入 public 目录或前端 bundle。
  - 笔记依据已核验范围独立撰写，不复制官方题目、示例或解析。
